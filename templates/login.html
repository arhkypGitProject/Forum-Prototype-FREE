<body><div class="shell auth-shell"><header><a class="brand" href="/"><span class="brand-mark">cg</span>Common Ground</a><a class="back-link" href="/">Back to discussions</a></header><main class="auth-card"><div class="eyebrow">Welcome back</div><h1>Pick up the conversation.</h1><p>Log in to reply to discussions and share your ideas.</p>{{ERROR}}<form method="post" action="/login">{{CSRF}}<input type="hidden" name="next" value="{{NEXT}}"><label for="username">Username</label><input id="username" name="username" value="{{USER}}" required maxlength="32" autocomplete="username" placeholder="Your username"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="1024" autocomplete="current-password" placeholder="Your password"><button class="new-topic auth-button" type="submit">Log in</button></form><div class="auth-foot">New to the community? <a href="/register">Create an account</a>.</div></main></div></body></html>
