<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up — Common Ground</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="shell auth-shell"><header><a class="brand" href="/"><span class="brand-mark">cg</span>Common Ground</a><a class="back-link" href="/">Back to discussions</a></header><main class="auth-card"><div class="eyebrow">A new space</div><h1>Join the conversation.</h1><p>Create an account to reply to discussions and share your ideas.</p>{{ERROR}}<form method="post" action="/register">{{CSRF}}<input type="hidden" name="next" value="{{NEXT}}"><label for="username">Username</label><input id="username" name="username" value="{{USER}}" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" autocomplete="username" placeholder="Choose a username"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password" placeholder="At least 8 characters"><button class="new-topic auth-button" type="submit">Create account</button></form><div class="auth-foot">Already have an account? <a href="/login">Log in</a>.</div></main></div></body></html>
